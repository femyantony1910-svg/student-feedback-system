services:
  - type: web
    name: student-feedback
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: student_feedback
